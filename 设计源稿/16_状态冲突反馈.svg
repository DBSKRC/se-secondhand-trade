<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844"><g font-family="Microsoft YaHei, sans-serif"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F7F5F2" stroke="none"/><text x="22" y="25" font-size="13" fill="#292529" font-weight="700">9:41</text><text x="295" y="25" font-size="11" fill="#292529" font-weight="400">▂ ▄ ▆   100%</text><text x="18" y="66" font-size="27" fill="#792D3C" font-weight="700">‹</text><text x="50" y="64" font-size="19" fill="#292529" font-weight="700">操作结果</text><rect x="16" y="140" width="358" height="244" rx="12" fill="#FFFFFF" stroke="none"/><text x="39" y="192" font-size="23" fill="#792D3C" font-weight="700">商品状态已变化</text><text x="39" y="234" font-size="14" fill="#292529" font-weight="400">该商品已被其他买家预约。</text><text x="39" y="266" font-size="14" fill="#292529" font-weight="400">本次未创建新的预约记录。</text><text x="39" y="298" font-size="14" fill="#292529" font-weight="400">请刷新查看当前状态。</text><rect x="32" y="424" width="326" height="44" rx="10" fill="#792D3C" stroke="none"/><text x="153.0" y="452" font-size="14" fill="#FFFFFF" font-weight="700">刷新商品信息</text><rect x="32" y="485" width="326" height="44" rx="10" fill="#FFFFFF" stroke="#E8E2DE"/><text x="153.0" y="513" font-size="14" fill="#792D3C" font-weight="700">返回商品列表</text><rect x="16" y="587" width="358" height="101" rx="12" fill="#F2E6E8" stroke="none"/><text x="29" y="617" font-size="12" fill="#792D3C" font-weight="400">无结果时显示：暂无符合条件的商品。</text><text x="29" y="642" font-size="12" fill="#792D3C" font-weight="400">提供“清空筛选”，不显示空白页面。</text><text x="29" y="667" font-size="12" fill="#792D3C" font-weight="400">所有失败都保留必要输入并说明原因。</text></g></svg>