[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-secondhand"
version = "0.1.0"
description = "Campus marketplace for local use"
requires-python = ">=3.11"

[project.scripts]
campus-market = "campus.__main__:main"
campus-mobile = "campus.mobile:main"

[tool.setuptools.packages.find]
include = ["campus*"]

[tool.setuptools.package-data]
campus = ["schema.sql", "mobile_ui/*", "mobile_ui/assets/*"]

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 80

[tool.pylint.messages_control]
disable = [
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-positional-arguments",
  "too-many-locals",
]
